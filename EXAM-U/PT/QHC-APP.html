<script type="text/javascript">

    $(function() {

    document.onselectstart = new Function("event.returnValue=false;"); //禁止選取


        var barh = $("#Panelbar").offset().top;
        var checkdown = 450;

        var downy = 565;

        downy = barh - $("#box1").height() * 0.9
        var barleft = $("#Panelbar").offset().left;
        var barright = $("#Panelbar").offset().left + 800;

        $(".dragitem").draggable({
            containment: "#content",
            stop: function (touch, ui) {
                //var xx = $(element).offset().left;
                //var yy = $(element).offset().top;
                //var ww = $(element).width();   //49
                //var hh = $(element).height();  //56

                var uix = ui.offset.left;
                var uiy = ui.offset.top;

                //var xx1 = $("#Panelbar").offset().left;  //14.999
              //  var yy1 = $("#Panelbar").offset().top;  //615.241
                 // console.log(uix,uiy);

               var nowi = this.id.substr(3, 1);

                var xpoint = 0;
                //拖曳選項
                if (uiy > checkdown ) {
                    //$(element).css("top", yy1-30); //下面圖案上移一點點
                    //hh = $(element).height();
                    //console.log("top:", yy1 - hh);
                    $("#box" + nowi).css("top", downy);      //拖曳物件y座標 = bar(y) + 物件高度 
                    $("#qbox" + nowi).css("display", "block");
                    $("#box" + nowi).parents("tr").addClass("gray");/*文字灰底*/

                    if (uix < barleft) {
                        $("#box" + nowi).css("left", barleft);
                        $("#xbox" + nowi).val(0);
                        $("#box" + nowi).attr("src", "images\\arrbox" + nowi + ".png");
                    } else if (uix > barright) {
                        $("#box" + nowi ).css("left", barright);
                        $("#xbox" + nowi).val(1);
                        $("#box" + nowi).attr("src", "images\\arrbox" + nowi + "r.png");
                    } else {
                        $("#box" + nowi).css("left", uix);
                        //console.log(uix, barleft);
                        xpoint = (uix - barleft)/800 ;
                        $("#xbox" + nowi).val(xpoint.toFixed(4));
                        if (uix > 400 + barleft) { $("#box" + nowi).attr("src", "images\\arrbox" + nowi + "r.png"); }
                        else { $("#box" + nowi).attr("src", "images\\arrbox" + nowi + ".png"); }
                    }
                } else {
                    $("#box" + nowi).css("left", $("#bbox" + nowi).offset().left);
                    $("#box" + nowi).css("top", $("#bbox" + nowi).offset().top);
                    $("#xbox" + nowi).val(-1);
                    $("#qbox" + nowi).css("display", "none");
                    $("#box" + nowi).attr("src", "images\\arrbox" + nowi + ".png");
                    $("#box" + nowi).parents("tr").removeClass("gray");
                }
                if ($("#xbox" + nowi).val() != -1) {
                    for (var i = 1; i <= 5; i++) {
                        if (nowi !=  i) {

                            if ($("#xbox" + nowi).val() != "-1") {
                                if (Math.abs($("#xbox" + nowi).val() - $("#xbox" + i).val()) < 0.01) {
                                    ShowMsg("選項 " + getchar(i) + " 與 " + getchar(nowi) + " 重複");
                                    $("#box" + nowi).css("left", $("#bbox" + nowi).offset().left);
                                    $("#box" + nowi).css("top", $("#bbox" + nowi).offset().top);
                                    $("#xbox" + nowi).val(-1);
                                    $("#qbox" + nowi).css("display", "none");
                                    $("#box" + nowi).parents("tr").removeClass("gray");
                                }
                            }
                        }
                    }
                }
            }
        });


        for (var i = 1; i <= 5; i++) {
            //設定初始位置
           // console.log("bbox_left" + i, $("#bbox" + i).offset().left);
          //  console.log("bbox_top" + i, $("#bbox" + i).offset().top);


          //  console.log("box_left" + i, $("#box" + i).offset().left);
           // console.log("box_top" + i, $("#box" + i).offset().top);

           // $('#box' + i).css("left", $("#bbox" + i).offset().left + 8);
          /// $('#box' + i).css("top", $("#bbox" + i).offset().top + 8);
            /*$('#qbox' + i).css("left", $("#bbox" + i).offset().left + 8);
            $('#qbox' + i).css("top", $("#bbox" + i).offset().top + 8);*/
        }


        //數字回傳字母
        function getchar(ch) {
            if (ch == 1) return "A";
            if (ch == 2) return "B";
            if (ch == 3) return "C";
            if (ch == 4) return "D";
            if (ch == 5) return "E";
        }

        //檢查作答
        $("#Bun_submit").click(function() {
            var x1 = $("#xbox1").val();
            var x2 = $("#xbox2").val();
            var x3 = $("#xbox3").val();
            var x4 = $("#xbox4").val();
            var x5 = $("#xbox5").val();
         
            if (x1 == -1 || x2 == -1 || x3 == -1 || x4 == -1 || x5 == -1 ) {
               //  $.prompt("Please complete answering all of the items", { show: 'slideDown', prefix: 'jqismooth' });
               //  return false;
               //  $.prompt("Please complete answering all of the items", { show: 'slideDown', prefix: 'jqismooth' });
               //  return false;
             } else {

         //  $.prompt("A:" + x1 + "<br/>B:" + x2 + "<br/>C:" + x3 + "<br/>D:" + x4 + "<br/>E:" + x5 + "<br/>F:" + x6 + "<br/>", { show: 'slideDown', prefix: 'jqismooth' });
            }

            if (x1 == -1) { ShowMsg("選項A尚未作答"); return false; }
            if (x2 == -1) { ShowMsg("選項B尚未作答"); return false; }
            if (x3 == -1) { ShowMsg("選項C尚未作答"); return false; }
            if (x4 == -1) { ShowMsg("選項D尚未作答"); return false; }
            if (x5 == -1) { ShowMsg("選項E尚未作答"); return false; }
          


        });

    });


</script>
