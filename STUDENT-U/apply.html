<div class="main index-main">

          <br>
          <h2 class="text-center">申請帳號</h2>
          <hr>
          <div class="for-data">
            <form class="form-horizontal" action="index.html">
              <div class="form-group">
                <div class="col-sm-9 col-sm-offset-3 col-lg-10  col-lg-offset-2">
                  <label class="radio-inline">
                    <input type="radio" name="country" id="" value="" checked >
                    本國籍</label>
                  <label class="radio-inline">
                    <input type="radio" name="country" id="" value="">
                    非本國籍</label>
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">帳號：</label>
                <div class="col-sm-9 col-lg-10">
                  <input type="text" class="form-control input-lg" id="" placeholder="身分證統一編號">
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">密碼：</label>
                <div class="col-sm-9 col-lg-10">
                  <input type="text" class="form-control input-lg" id="" placeholder="請輸入以英數字元設置6-20位的密碼">
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">確認密碼：</label>
                <div class="col-sm-9 col-lg-10">
                  <input type="text" class="form-control input-lg" id="" placeholder="請再次輸入密碼">
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">姓名：</label>
                <div class="col-sm-9 col-lg-10">
                  <input type="text" class="form-control input-lg" id="" placeholder="請輸入姓名">
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">性別：</label>
                <div class="col-sm-9 col-lg-10">
                  <label class="radio-inline">
                    <input type="radio" name="inlineRadioOptions" id="" value="">
                    男 </label>
                  <label class="radio-inline">
                    <input type="radio" name="inlineRadioOptions" id="" value="">
                    女 </label>
                </div>
              </div>
              <div class="form-group">
                <label for="inputPassword3" class="col-sm-3 col-lg-2 control-label">生日： </label>
                <div class="col-sm-9 col-lg-10">
                  <div class="form-inline">
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>1990</option>
                      <option>1991</option>
                      <option>1992</option>
                      <option>1993</option>
                    </select>
                    年
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                    月
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                    日
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">E-Mail：</label>
                <div class="col-sm-9 col-lg-10">
                  <input type="email" class="form-control input-lg" id="" placeholder="請輸入E-Mail">
                </div>
              </div>
              <div class="form-group">
                <label for="inputPassword3" class="col-sm-3 col-lg-2 control-label">學校：</label>
                <div class="col-sm-9 col-lg-10">
                  <div class="form-inline">
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">群組/組別：</label>
                <div class="col-sm-9 col-lg-10">
                  <div class="form-inline">
                    <select class="form-control input-lg">
                      <option>請選擇</option>
                      <option>2</option>
                      <option>3</option>
                      <option>4</option>
                      <option>5</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="" class="col-sm-3 col-lg-2 control-label">驗證碼：</label>
                <div class="col-sm-9 col-lg-10">
                  <div class="form-inline">
                    <input type="text" class="form-control input-lg" id="" placeholder="請輸入驗證碼">
                    <img id="codeImage" src="https://career.ntnu.edu.tw/junior/Validate/ValidateCode.ashx" style="border-width:0px; width:110px ; height:46px; border:1px solid #ccc; border-radius:6px 0 0 6px;"><img src="https://career.ntnu.edu.tw/junior/images/autorenew.jpg" onclick="RenewCode()" style="border:1px solid #ccc; width:33px ; height:46px; padding:12px 8px; background-color:#FFF; border-radius:0 4px 4px 0; margin-left:-1px; cursor:pointer;">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <div class="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2">
                  <button type="button" class="btn btn-default btn-lg" onclick="window.location='index.html'">取消</button>
                  <button type="submit" class="btn btn-default btn-lg" onclick="alert('恭喜已成功註冊！請使用設定之帳號密碼登入系統。')">註冊</button>
                </div>
              </div>
            </form>
          </div>
